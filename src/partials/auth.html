<!-- Email + Password Auth Modal Overlay -->
<div class="modal-overlay" id="authOverlay" style="align-items: center; z-index: 300">
  <div class="modal-content" style="max-width: 400px; text-align: center">
    <div class="brand-logo" style="justify-content: center; margin-bottom: 8px">
      <span class="logo-bolt"><i data-icon="zap" data-size="22"></i></span>
      <span>IronTrack</span>
    </div>
    <h2 id="authTitle" style="font-size: 20px; font-weight: 700">Sign in to sync</h2>
    <p style="font-size: 13.5px; color: var(--muted); margin-bottom: 16px">
      Back up your workouts and pick up where you left off on any device.
    </p>

    <form
      id="authForm"
      data-on-submit="handleAuthSubmit"
      data-args='["$event"]'
      style="display: flex; flex-direction: column; gap: 12px"
    >
      <input
        type="email"
        id="authEmail"
        class="input-field"
        placeholder="Email address"
        autocomplete="off"
        required
        style="padding: 13px; font-size: 14px; text-align: left"
      />
      <input
        type="password"
        id="authPassword"
        class="input-field"
        placeholder="Password (min 6 characters)"
        autocomplete="current-password"
        required
        minlength="6"
        style="padding: 13px; font-size: 14px; text-align: left"
      />
      <button type="button" class="auth-link auth-forgot" id="authForgotBtn" data-on-click="requestPasswordReset">
        Forgot password?
      </button>

      <div id="authCaptcha" class="auth-captcha"></div>
      <button type="submit" class="btn btn-primary" id="authSubmitBtn" style="justify-content: center; margin-top: 4px">
        Sign in
      </button>

      <div style="font-size: 12.5px; color: var(--muted); margin-top: 6px">
        <span id="authToggleText">Need an account?</span>
        <button type="button" class="auth-link" id="authToggleBtn" data-on-click="toggleAuthMode">Create one</button>
      </div>

      <div id="authMsg" style="font-size: 13.5px; display: none; line-height: 1.4"></div>
      <button type="button" class="auth-link" id="authFixEmailBtn" data-on-click="useSuggestedEmail" hidden></button>
      <button type="button" class="auth-link" id="authResendBtn" data-on-click="resendConfirmation" hidden>
        Resend the email
      </button>
    </form>
    <button
      type="button"
      class="btn btn-secondary"
      data-on-click="skipSignIn"
      style="width: 100%; justify-content: center; margin-top: 14px"
    >
      Continue without an account
    </button>
    <p style="font-size: 12px; color: var(--muted); margin-top: 8px">
      Your data stays on this device. You can sign in later from your profile.
    </p>
  </div>
</div>

<div class="modal-overlay" id="resetOverlay" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
  <div class="modal-content auth-card">
    <h2 id="resetTitle" class="auth-title">Set a new password</h2>
    <p class="auth-hint">Choose a new password for <strong id="resetEmail"></strong>.</p>
    <form class="auth-form" data-on-submit="submitNewPassword" data-args='["$event"]'>
      <input
        type="password"
        id="resetPassword"
        class="input-field auth-input"
        placeholder="New password (min 6 characters)"
        autocomplete="new-password"
        required
        minlength="6"
      />
      <input
        type="password"
        id="resetPasswordConfirm"
        class="input-field auth-input"
        placeholder="Repeat the new password"
        autocomplete="new-password"
        required
        minlength="6"
      />
      <button type="submit" class="btn btn-primary auth-submit" id="resetSubmitBtn">Save password</button>
      <div id="resetMsg" class="auth-msg" hidden></div>
    </form>
  </div>
</div>
