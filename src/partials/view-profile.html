<!-- PROFILE VIEW -->
<section id="view-profile" class="app-view">
  <div class="settings-card" style="gap: 16px">
    <div class="analytics-header">
      <span><i data-icon="user" data-size="20"></i> Profile &amp; Biometrics</span>
    </div>

    <div class="avatar-upload-container">
      <div class="avatar-preview" id="avatarPreviewContainer">
        <span id="avatarInitials">SK</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label
          class="btn-xs"
          style="width: fit-content; cursor: pointer; color: var(--accent); border-color: var(--accent-glow)"
        >
          <i data-icon="camera" data-size="14"></i> Upload Avatar
          <input
            type="file"
            id="avatarFileInput"
            accept="image/*"
            style="display: none"
            data-on-change="handleAvatarUpload"
            data-args='["$el"]'
          />
        </label>
        <span style="font-size: 11px; color: var(--muted)"
          >Initials are automatically generated from your name if no photo is uploaded.</span
        >
      </div>
    </div>

    <div class="calc-row">
      <div class="meta-field">
        <label><i data-icon="user" data-size="13"></i> Full Name</label>
        <input
          type="text"
          id="profileFullName"
          class="input-field"
          placeholder="Your name"
          style="text-align: left; padding: 12px"
          data-on-input="saveProfileTab"
        />
      </div>
      <div class="meta-field">
        <label><i data-icon="cake" data-size="13"></i> Age (Years)</label>
        <input
          type="number"
          id="profileTabAge"
          class="input-field"
          placeholder="23"
          step="1"
          data-on-input="saveProfileTab"
        />
      </div>
    </div>

    <div class="calc-row">
      <div class="meta-field">
        <label><i data-icon="scale" data-size="13"></i> Body Weight (kg)</label>
        <input
          type="number"
          id="profileTabWeight"
          class="input-field"
          placeholder="72.5"
          step="0.1"
          data-on-input="saveProfileTab"
        />
      </div>
      <div class="meta-field">
        <label><i data-icon="ruler" data-size="13"></i> Height (cm)</label>
        <input
          type="number"
          id="profileTabHeight"
          class="input-field"
          placeholder="175"
          step="1"
          data-on-input="saveProfileTab"
        />
      </div>
    </div>

    <div class="meta-field">
      <label>Biological sex (for BMR)</label>
      <select id="profileTabSex" class="machine-dropdown" style="width: 100%" data-on-change="saveProfileTab">
        <option value="male">Male (+5)</option>
        <option value="female">Female (-161)</option>
      </select>
    </div>

    <div
      class="calc-result-box"
      id="profileSummaryBox"
      style="font-size: 13.5px; text-align: left; padding: 14px; display: flex; flex-direction: column; gap: 6px"
    >
      <span id="profileBmiResult" style="color: var(--accent)">BMI: --</span>
      <span id="profileBmrResult" style="color: var(--text)">Estimated BMR: -- kcal/day</span>
    </div>

    <div style="display: flex; gap: 12px; flex-wrap: wrap">
      <button
        class="btn btn-primary"
        data-on-click="showToast"
        data-args='["✅ Profile saved successfully!", "success"]'
      >
        <i data-icon="save"></i> Save Profile
      </button>
      <button class="btn btn-secondary" data-on-click="exportFullBackup">
        <i data-icon="download"></i> Export Backup
      </button>
    </div>
  </div>

  <div class="settings-card" style="gap: 14px">
    <div class="settings-title" style="font-size: 15px; font-weight: 800">
      <i data-icon="lock" data-size="18"></i> Cloud Account &amp; Sync
    </div>
    <div class="sync-status-row">
      <span class="sync-dot" data-state="synced" id="profileSyncDot"></span>
      <span id="syncStatusText">Synced</span>
      <button
        class="btn-xs"
        id="manualSyncBtn"
        data-on-click="pullFromCloud"
        data-args="[true]"
        style="margin-left: auto"
      >
        <i data-icon="refresh" data-size="14"></i> <span class="btn-label">Sync now</span>
      </button>
    </div>
    <div id="accountSignedIn" style="display: flex; flex-direction: column; gap: 14px">
      <div class="meta-field">
        <label>Cloud sync status</label>
        <input
          type="text"
          id="profileEmailField"
          class="input-field"
          readonly
          style="text-align: left; padding: 12px; color: var(--muted)"
          value="Connected via Supabase Auth"
        />
      </div>
      <button class="btn btn-danger" data-on-click="handleSignOut" style="justify-content: center; margin-top: 4px">
        <i data-icon="log-out"></i> Log Out of Account
      </button>
      <div class="account-delete">
        <button class="btn btn-secondary" data-on-click="deleteAccount">
          <i data-icon="trash"></i> Delete account
        </button>
        <p>Permanently deletes your account and everything synced to it.</p>
      </div>
    </div>
    <div id="accountSignedOut" style="display: none; flex-direction: column; gap: 10px">
      <p style="font-size: 13px; color: var(--muted)">
        Sign in to back up your workouts and sync them across your devices.
      </p>
      <button class="btn btn-primary" data-on-click="openSignIn" style="justify-content: center">
        <i data-icon="cloud"></i> Sign in to sync
      </button>
    </div>
  </div>
</section>
