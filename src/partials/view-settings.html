<!-- SETTINGS VIEW -->
<section id="view-settings" class="app-view">
  <div class="settings-card">
    <div class="settings-row" style="flex-direction: column; align-items: flex-start; gap: 10px">
      <span class="settings-title"><i data-icon="palette" data-size="16"></i> Theme Accent</span>
      <select
        id="themeSelect"
        class="machine-dropdown"
        style="width: 100%"
        data-on-change="changeTheme"
        data-args='["$value"]'
      >
        <option value="cyan">Neon Cyan</option>
        <option value="lime">Toxic Lime</option>
        <option value="magenta">Cyber Magenta</option>
        <option value="amber">Solar Amber</option>
      </select>
    </div>
  </div>
  <div class="settings-card">
    <button class="btn btn-secondary" data-on-click="restoreAllHiddenExercises">
      <i data-icon="reset"></i> Restore All Removed Exercises &amp; Default Days
    </button>
  </div>
  <div class="settings-card">
    <label class="settings-row"
      ><span class="settings-title"><i data-icon="volume" data-size="16"></i> Rest Timer Beeps</span
      ><input type="checkbox" id="soundToggle" checked data-on-change="saveSettings"
    /></label>
  </div>
  <div class="settings-card">
    <label class="settings-row"
      ><span class="settings-title"><i data-icon="vibrate" data-size="16"></i> Haptic Vibration</span
      ><input type="checkbox" id="vibeToggle" checked data-on-change="saveSettings"
    /></label>
  </div>
  <div class="settings-card">
    <div class="settings-row" style="flex-direction: column; align-items: flex-start; gap: 10px">
      <div class="range-label">
        <span class="settings-title"><i data-icon="clock" data-size="16"></i> Rest Timer Multiplier</span
        ><span id="restMultiplierValue" style="color: var(--accent)">1.00x</span>
      </div>
      <input
        type="range"
        id="restMultiplier"
        min="0.5"
        max="2.0"
        step="0.25"
        value="1"
        data-on-input="onRestMultiplierInput"
        style="width: 100%"
      />
    </div>
  </div>
  <div class="settings-card" style="gap: 16px">
    <div class="settings-title" style="font-size: 15px; font-weight: 800">
      <i data-icon="archive" data-size="18"></i> Backup
    </div>
    <button class="btn btn-primary" data-on-click="exportFullBackup">
      <i data-icon="download"></i> Export Full Backup
    </button>
    <label style="display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; color: var(--muted)">
      <span class="settings-title"><i data-icon="upload" data-size="16"></i> Import Backup (JSON)</span>
      <input
        type="file"
        id="importBackupInput"
        class="settings-file"
        accept=".json,application/json"
        data-on-change="importBackupFile"
        data-args='["$el"]'
      />
    </label>
  </div>
</section>
