<!doctype html>
<html lang="en" data-theme="cyan">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta
      name="description"
      content="A free, open-source workout tracker that works with no signal and tells you what to lift next."
    />
    <title>IronTrack • Ultimate Workout Hub</title>
    <!-- Link previews (WhatsApp, Reddit, X, Slack…). Crawlers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IronTrack" />
    <meta property="og:url" content="https://track-sr-8532.vercel.app/" />
    <meta property="og:title" content="IronTrack · Offline-first workout tracker" />
    <meta
      property="og:description"
      content="Log every set with no signal, get today's weight from last session, and keep nutrition in one free app."
    />
    <meta property="og:image" content="https://track-sr-8532.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="IronTrack: log every set, even with no signal." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="IronTrack" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- @include auth.html -->

    <div class="app-shell">
      <div class="app-topbar">
        <div>
          <div class="brand-logo">
            <span class="logo-bolt"><i data-icon="zap" data-size="22"></i></span>
            <span>IronTrack</span>
          </div>
          <div class="home-summary" id="homeSummary"></div>
        </div>
        <div class="user-auth-bar" id="userBar">
          <button
            class="avatar-btn"
            id="profileToggleBtn"
            data-on-click="toggleProfileTab"
            aria-label="Profile and sync"
          >
            <span class="avatar-btn-face" id="headerAvatar">?</span>
            <span class="sync-dot" id="syncDot" data-state="synced"></span>
          </button>
        </div>
      </div>

      <main class="app-views">
        <!-- @include view-workout.html -->

        <!-- @include view-nutrition.html -->

        <!-- @include view-analytics.html -->

        <!-- @include view-tools.html -->

        <!-- @include view-settings.html -->

        <!-- @include view-profile.html -->
      </main>
    </div>

    <nav class="bottom-nav" id="bottomNav">
      <button class="bottom-tab active" data-tab="workout">
        <span class="bottom-tab-icon"><i data-icon="dumbbell" data-size="21"></i></span><span>Workout</span>
      </button>
      <button class="bottom-tab" data-tab="nutrition">
        <span class="bottom-tab-icon"><i data-icon="salad" data-size="21"></i></span><span>Nutrition</span>
      </button>
      <button class="bottom-tab" data-tab="analytics">
        <span class="bottom-tab-icon"><i data-icon="chart" data-size="21"></i></span><span>Analytics</span>
      </button>
      <button class="bottom-tab" data-tab="tools">
        <span class="bottom-tab-icon"><i data-icon="calculator" data-size="21"></i></span><span>Tools</span>
      </button>
      <button class="bottom-tab" data-tab="settings">
        <span class="bottom-tab-icon"><i data-icon="settings" data-size="21"></i></span><span>Settings</span>
      </button>
    </nav>

    <div class="rest-modal" id="restModal">
      <div class="rest-timer-val" id="restTimerDisplay">00:00</div>
      <button
        class="btn-xs"
        style="background: rgba(239, 68, 68, 0.18); color: #fca5a5; border-color: rgba(239, 68, 68, 0.35)"
        data-on-click="cancelRestTimer"
      >
        Skip
      </button>
    </div>

    <div class="celebration-overlay" id="celebrationOverlay"></div>
    <div class="toast-container" id="toastContainer"></div>

    <!-- First-run setup (filled in by src/render/onboarding.js) -->
    <div class="modal-overlay" id="onboardOverlay" role="dialog" aria-modal="true" aria-label="Set up IronTrack">
      <div class="modal-content onboard-card" id="onboardBody"></div>
    </div>

    <!-- @include plan-modals.html -->

    <!-- @include history-modal.html -->

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
